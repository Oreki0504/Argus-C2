name: Console frontend validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go test ./internal/console -run TestConsoleRealManagementAndPublicProjection -count=1
        working-directory: .
        env:
          ARGUS_CONSOLE_CONTRACT_FILE: ${{ runner.temp }}/argus-console-contract.json
      - run: npm test
        env:
          ARGUS_CONSOLE_CONTRACT_FILE: ${{ runner.temp }}/argus-console-contract.json
      - name: Build Console and Linux Server release bundles
        run: sh deploy/linux/build-server-bundles.sh "$RUNNER_TEMP/argus-server-release"
        working-directory: .
      - name: Verify real Server bundle with isolated system operations
        run: python3 -m unittest discover -s test/deployment -p 'server_installer_test.py' -v
        working-directory: .
        env:
          ARGUS_SERVER_TEST_BUNDLE: ${{ runner.temp }}/argus-server-release/argus-server-linux-amd64.tar.gz
      - name: Verify native Server installation and bootstrap on disposable VM
        run: sudo env GITHUB_ACTIONS=true python3 test/deployment/server_install_smoke.py --disposable-ci --bundle "$RUNNER_TEMP/argus-server-release/argus-server-linux-amd64.tar.gz"
        working-directory: .
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: console-assets
          path: internal/webui/dist
          if-no-files-found: error
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: server-bundles
          path: ${{ runner.temp }}/argus-server-release
          if-no-files-found: error
  go-ui:
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: console-assets
          path: internal/webui/dist
      - run: go build -tags ui ./...
      - run: go test -tags ui ./... -count=1
