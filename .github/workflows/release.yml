name: Publish Server release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, for example v0.1.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate the selected version tag
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?', tag):
              raise SystemExit('Use a version tag, not a branch or arbitrary ref.')
          PY
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm test
        working-directory: web
      - name: Build version-pinned release assets
        run: sh deploy/linux/build-server-bundles.sh "$RUNNER_TEMP/argus-release" "$RELEASE_TAG"
      - run: go test -tags ui ./... -count=1
      - name: Validate installation and download flows
        run: python3 -m unittest discover -s test/deployment -p 'server_*test.py' -v
        env:
          ARGUS_SERVER_TEST_BUNDLE: ${{ runner.temp }}/argus-release/argus-server-linux-amd64.tar.gz
      - name: Verify native Server installation and bootstrap on disposable VM
        run: sudo env GITHUB_ACTIONS=true python3 test/deployment/server_install_smoke.py --disposable-ci --bundle "$RUNNER_TEMP/argus-release/argus-server-linux-amd64.tar.gz"
      - name: Publish verified assets without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/argus-release"
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ['RELEASE_TAG']
          url = f'https://github.com/Oreki0504/Argus-C2/releases/download/{tag}/install-server.py'
          command = f'''( f=$(mktemp) || exit 1; trap 'rm -f -- "$f"' EXIT; curl --fail --location --proto '=https' --proto-redir '=https' '{url}' -o "$f" && sudo python3 "$f" )'''
          notes = f'''Install ARGUS Server on a new Linux/systemd host (x86_64 or ARM64):

          ```sh
          {command}
          ```

          Admin can now rename or delete Agents in Management. Public names update in Overview. Deletion revokes the identity and removes task/metric history while retaining audit; it does not uninstall the remote host.

          Account & sign-in can permanently disable the original administrator Token after successful OAuth login or binding within ten minutes. Token-only sessions are revoked, OAuth sessions remain, and removing the last linked provider is blocked. Server-local recovery remains available.

          GitHub callback errors now distinguish missing cookies, expired/replaced flows, state/path/issuer mismatches, configuration changes and account-state failures. These diagnostics preserve all authentication checks. A live retry is still needed to identify the reported deployment failure; no confirmed GitHub root-cause fix is claimed.

          These changes require only a Server update. Server schema 104, Agent schema 101 and protocol 1 are unchanged.

          New installations now serve Console HTTPS on port 443 as the dedicated non-root service user; existing updates/restores retain their configured ports and OAuth callbacks. Fleet remains on 8443.

          Console now collects system information hourly and resource metrics each minute through idle Agent polls, respecting local policy and existing queued work. Updated Agents automatically select default-route network interfaces when the local list is empty. Two recent samples provide average network rates; bandwidth capacity/percentages and traffic totals remain unavailable. Monitoring history uses ordinary task retention.

          Account settings now put OAuth app configuration before personal identity linking. GitHub requests explicitly negotiate JSON and include a User-Agent; failures distinguish credentials, callback, code, profile and upstream problems, with secret-free stage diagnostics. A live GitHub retry is still needed to diagnose any deployment-specific failure.

          Agent install output includes a downloadable uninstall/purge command. `--uninstall agent --purge` removes current programs, service, configuration, identity, database and the dedicated account; delete or disable the registered Agent in Console when retiring it. Historical backups remain.

          The installer first asks for Chinese or English, downloads and verifies the matching bundle, and configures HTTPS. On success, it prints `/login` and the private administrator token path. An interactive terminal displays the token; redirected output does not. Read it locally with `sudo cat /etc/argus-c2/setup/console.token`.

          Enter this random token to open administrator management immediately. It remains usable after logout or restart until explicitly disabled. Google, GitHub and custom OIDC are optional in Account & sign-in: configure providers later and explicitly bind identities to the same local account. Token login never requires an OAuth application. OAuth itself still requires the operator's app credentials once, in the optional settings page.

          To update a standard installation, append `--update server` or `--update agent` to the Python invocation above. Server schema 102/103 is backed up, migrated to 104 on a copy, checked, and applied while stopped. Existing users, provider identities and Fleet data are preserved. An uninitialized Console receives a fresh token; use the path printed by the updater. Activated accounts are never automatically replaced. Schema 104 cannot run older binaries. If schema replacement has started and service checks fail, the updater keeps the new programs and current data and stops the service for recovery rather than rewinding possibly accepted work.

          Uninstall is included in this same script: append `--uninstall server` or `--uninstall agent`. It shows the removal plan and asks for confirmation, then stops/disables only that component and removes programs/services while keeping configuration, database, certificates and identity. Add `--dry-run` to inspect without changes. Add `--purge` to delete the current component data and dedicated account for a fresh install; historical backups, the maintenance helper and Certbot installation remain. Purge requires typing `purge server` or `purge agent`; `--yes` is the explicit noninteractive confirmation. No bundle download or ACME operation is performed for uninstall.

          Keep-data uninstall can now be resumed with `--restore server` or `--restore agent`. A normal interactive Server install detects retained data and offers restoration before asking for domain, email or certificate terms. Restore validates the archived programs against a copy of the retained database, restores only programs/service definitions, and reuses the existing certificates, identity and login. No certificate is requested and no schema is migrated. It restores the archived version; update separately afterward for new features.

          Account & sign-in now includes collapsible English/Chinese Google and GitHub OAuth application tutorials with the current Console callback URL, provider-console links, client type/credentials instructions, Google test-user setup and common redirect mismatch guidance.

          Update failures now print the failing stage and command exit code. Bounded command diagnostics are saved to the private backup's `failure.json`; never publish this file without reviewing it for credentials. The pipeline verifies native schema 103 migration, keep-data uninstall/restore, component isolation and purge/reinstall.

          Certificate failures now distinguish connection, DNS, challenge-response and local port errors without exposing tokens. The installer prints the exact `/var/lib/argus-certbot/logs/letsencrypt.log` path and a command to inspect it. Early installation failures preserve the Certbot environment and ACME state for a retry.

          Public certificate issuance requires inbound TCP 80; private LAN IPs use a separately trusted local CA. Existing Server installations are preserved. See `docs/server-installation.zh-CN.md` at this tag for deployment and renewal details.
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'], 'argus-release-notes.md').write_text(notes)
          PY
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ARGUS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/argus-release-notes.md" \
            install-server.py SHA256SUMS argus-server-linux-amd64.tar.gz argus-server-linux-arm64.tar.gz
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
