name: Publish Server release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, for example v0.1.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate the selected version tag
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?', tag):
              raise SystemExit('Use a version tag, not a branch or arbitrary ref.')
          PY
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm test
        working-directory: web
      - name: Build version-pinned release assets
        run: sh deploy/linux/build-server-bundles.sh "$RUNNER_TEMP/argus-release" "$RELEASE_TAG"
      - run: go test -tags ui ./... -count=1
      - name: Validate installation and download flows
        run: python3 -m unittest discover -s test/deployment -p 'server_*test.py' -v
        env:
          ARGUS_SERVER_TEST_BUNDLE: ${{ runner.temp }}/argus-release/argus-server-linux-amd64.tar.gz
      - name: Verify native Server installation and bootstrap on disposable VM
        run: sudo env GITHUB_ACTIONS=true python3 test/deployment/server_install_smoke.py --disposable-ci --bundle "$RUNNER_TEMP/argus-release/argus-server-linux-amd64.tar.gz"
      - name: Publish verified assets without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/argus-release"
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ['RELEASE_TAG']
          url = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/{tag}/install-server.py'
          command = f'''( f=$(mktemp) || exit 1; trap 'rm -f -- "$f"' EXIT; curl --fail --location --proto '=https' --proto-redir '=https' '{url}' -o "$f" && sudo python3 "$f" )'''
          agent_update = command.replace('sudo python3 "$f" )', 'sudo python3 "$f" --update agent )')
          server_update = command.replace('sudo python3 "$f" )', 'sudo python3 "$f" --update server )')
          notes = f'''Linux Agents now report the installed distribution and numeric release from `os-release`. Overview and node details show values such as `Debian 13 · amd64` and `Ubuntu 24.04 · arm64` after a new `system.info` result. Previously, Agents reported only `linux`.

          Update each existing Agent host to enable this change:

          ```sh
          {agent_update}
          ```

          The updater preserves node ID, certificates, configuration, policy and database state, creates a private backup, and restores the previous program if the update fails. It requires a standard Linux/systemd installation. Run it on each Agent host; upgrading Server does not upgrade deployed Agents.

          System information is collected automatically about once an hour when Console monitoring is enabled and local policy permits it. An administrator can dispatch `system.info` to refresh it immediately after updating. Overview refreshes every 30 seconds. An existing Server with distribution-aware summaries can display the new value without a Server upgrade.

          Distribution detection reads bounded local `/etc/os-release` or `/usr/lib/os-release` files, supports their symlinks, and uses recognized IDs and numeric versions without executing shell content. Recognized rolling distributions can report their name without a version. Missing or unrecognized data retains the `linux` fallback. Public summaries continue to expose only the existing restricted OS vocabulary.

          Agent schema 101, Server schema 104 and protocol 1 are unchanged. Tests cover distribution parsing, fallback and file precedence, symlinks, size limits, and public OS/architecture projection. The release pipeline validates Go tests, frontend checks, both architecture bundles and native Server installation before publication.

          Update Server to refresh its hosted Agent installation binaries for future installations:

          ```sh
          {server_update}
          ```

          To install Server on a new Linux/systemd host:

          ```sh
          {command}
          ```

          Assets include the version-pinned installer, SHA256SUMS, and Linux amd64/arm64 Server bundles containing both Agent architectures. Target hosts do not need Go or Node. Existing Agent hosts use `--update agent`; the Console-generated Add Agent command remains for new installations.

          See `docs/server-installation.zh-CN.md` and `docs/agent-installation.zh-CN.md` at this tag for installation, update and recovery details.
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'], 'argus-release-notes.md').write_text(notes)
          PY
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ARGUS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/argus-release-notes.md" \
            install-server.py SHA256SUMS argus-server-linux-amd64.tar.gz argus-server-linux-arm64.tar.gz
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"


