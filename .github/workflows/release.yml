name: Publish Server release
on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to build and publish, for example v0.1.0-preview.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: server-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Validate the selected version tag
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?', tag):
              raise SystemExit('Use a version tag, not a branch or arbitrary ref.')
          PY
          git show-ref --verify "refs/tags/$RELEASE_TAG"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run lint && npm test
        working-directory: web
      - name: Build version-pinned release assets
        run: sh deploy/linux/build-server-bundles.sh "$RUNNER_TEMP/argus-release" "$RELEASE_TAG"
      - run: go test -tags ui ./... -count=1
      - name: Validate installation and download flows
        run: python3 -m unittest discover -s test/deployment -p 'server_installer_test.py' -v
        env:
          ARGUS_SERVER_TEST_BUNDLE: ${{ runner.temp }}/argus-release/argus-server-linux-amd64.tar.gz
      - name: Verify native Server installation and bootstrap on disposable VM
        run: sudo env GITHUB_ACTIONS=true python3 test/deployment/server_install_smoke.py --disposable-ci --bundle "$RUNNER_TEMP/argus-release/argus-server-linux-amd64.tar.gz"
      - name: Publish verified assets without replacing an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/argus-release"
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ['RELEASE_TAG']
          url = f'https://github.com/Oreki0504/Argus-C2/releases/download/{tag}/install-server.py'
          command = f'''( f=$(mktemp) || exit 1; trap 'rm -f -- "$f"' EXIT; curl --fail --location --proto '=https' --proto-redir '=https' '{url}' -o "$f" && sudo python3 "$f" )'''
          notes = f'''Install ARGUS Server on a new Linux/systemd host (x86_64 or ARM64):

          ```sh
          {command}
          ```

          The installer first asks for Chinese or English, downloads the matching version, verifies its SHA-256, and asks for a domain or IP to configure HTTPS. Python 3.10+, OpenSSL and systemd-sysusers are required. On success, an interactive terminal displays the 15-minute bootstrap code and `/setup` URL. The code is also saved at `/etc/argus-c2/setup/bootstrap.token`; read it locally with `sudo cat /etc/argus-c2/setup/bootstrap.token`.

          First-run setup now supports direct Google and GitHub login, separately or together: prove ownership, configure your OAuth application credentials, and click a provider button to bind the first administrator. Auth0/custom OIDC remains optional, and existing OIDC configurations remain readable. Callback addresses are provided by the page. See `docs/console-login.zh-CN.md` at this tag. Newly configured provider sets require this version or newer; they are not compatible with older binaries. Accounts from different providers are approved separately.

          To update a completed standard installation, append `--update server` or `--update agent` to the `sudo python3 "$f"` invocation above. An earlier failure during certificate preparation is not a completed installation: run the Server command above without `--update server` first. Missing accounts or files now produce actionable installation checks instead of a Python traceback; partial installations are preserved for repair. Updates preserve configuration and identity, back up state, check database compatibility on a copy, and restore previous programs if startup fails. Update Agents individually on their hosts. See the tagged installation guide for backup and recovery details.

          Certificate failures now distinguish connection, DNS, challenge-response and local port errors without exposing tokens. The installer prints the exact `/var/lib/argus-certbot/logs/letsencrypt.log` path and a command to inspect it. Early installation failures preserve the Certbot environment and ACME state for a retry.

          Public certificate issuance requires inbound TCP 80; private LAN IPs use a separately trusted local CA. Existing Server installations are preserved. See `docs/server-installation.zh-CN.md` at this tag for deployment and renewal details.
          '''
          pathlib.Path(os.environ['RUNNER_TEMP'], 'argus-release-notes.md').write_text(notes)
          PY
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "ARGUS $RELEASE_TAG" --notes-file "$RUNNER_TEMP/argus-release-notes.md" \
            install-server.py SHA256SUMS argus-server-linux-amd64.tar.gz argus-server-linux-arm64.tar.gz
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
